<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1b5e20">
<title>Roller-Navi 45</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
  :root { --green:#1b5e20; --green-light:#2e7d32; --bg:#f4f6f4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); }
  #app { display:flex; flex-direction:column; height:100dvh; }

  header { background:var(--green); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:8px; z-index:10; }
  header h1 { font-size:17px; margin:0; font-weight:600; flex:1; }
  header .gear { background:none; border:none; color:#fff; font-size:20px; padding:4px 6px; cursor:pointer; }
  header.nav-hide { display:none; }

  .search-bar { padding:10px 12px; background:#fff; border-bottom:1px solid #e0e0e0; position:relative; z-index:10; }
  .search-bar.nav-hide { display:none; }
  .search-bar input { width:100%; padding:12px 14px; font-size:16px; border:1px solid #cfd8cf; border-radius:10px; outline:none; }
  .search-bar input:focus { border-color:var(--green-light); }
  .suggestions { position:absolute; left:12px; right:12px; top:60px; background:#fff; border:1px solid #e0e0e0; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.12); z-index:1200; max-height:240px; overflow-y:auto; }
  .suggestions div { padding:12px 14px; font-size:14px; border-bottom:1px solid #f0f0f0; cursor:pointer; }
  .suggestions div:last-child { border-bottom:none; }
  .suggestions div:active { background:#eef5ee; }

  .banner { background:#e8f5e9; color:#1b5e20; font-size:12px; padding:8px 14px; border-bottom:1px solid #c8e6c9; z-index:10; }
  .banner.nav-hide { display:none; }

  #mapwrap { flex:1; position:relative; }
  #map { position:absolute; inset:0; }

  .puck { width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:30px solid #1565c0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5)); }

  .fab { position:absolute; right:14px; bottom:24px; z-index:600; display:flex; flex-direction:column; gap:10px; }
  .fab button { width:50px; height:50px; border-radius:50%; border:none; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.3); font-size:21px; cursor:pointer; }
  .fab button.go { background:var(--green); color:#fff; }

  .route-info { background:#fff; border-top:1px solid #e0e0e0; max-height:42vh; display:flex; flex-direction:column; z-index:10; }
  .route-info.hidden { display:none; }
  .route-summary { display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid #eee; }
  .route-summary .big { font-size:22px; font-weight:700; color:var(--green); }
  .route-summary .sub { font-size:13px; color:#555; }
  .route-summary .safe { font-size:12px; color:#1b5e20; font-weight:600; margin-top:2px; }
  .route-summary .warn { font-size:12px; color:#c62828; font-weight:600; margin-top:2px; }
  .route-summary .close { margin-left:auto; background:#eee; border:none; border-radius:50%; width:30px; height:30px; font-size:16px; cursor:pointer; }
  .start-nav { display:block; width:calc(100% - 32px); margin:10px 16px 12px; padding:14px; font-size:17px; font-weight:600; background:var(--green); color:#fff; border:none; border-radius:12px; cursor:pointer; }
  .steps { overflow-y:auto; padding:4px 0; }
  .step { padding:11px 16px; font-size:14px; border-bottom:1px solid #f3f3f3; display:flex; gap:10px; }
  .step .dist { color:#888; font-size:12px; min-width:54px; text-align:right; }

  .nav-hud { position:absolute; top:0; left:0; right:0; z-index:700; background:linear-gradient(180deg,#1b5e20,#1b5e20ee); color:#fff; padding:16px; display:none; align-items:center; gap:16px; box-shadow:0 2px 12px rgba(0,0,0,.35); }
  .nav-hud.active { display:flex; }
  .nav-hud .arrow { font-size:42px; line-height:1; }
  .nav-hud .txt { flex:1; min-width:0; }
  .nav-hud .nav-dist { font-size:28px; font-weight:800; }
  .nav-hud .nav-instr { font-size:15px; opacity:.95; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .nav-hud .quit { background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:8px; padding:10px 12px; font-size:14px; cursor:pointer; flex-shrink:0; }
  .nav-foot { position:absolute; bottom:0; left:0; right:0; z-index:700; background:#fff; border-top:1px solid #e0e0e0; padding:12px 16px; display:none; justify-content:space-between; align-items:center; font-size:15px; }
  .nav-foot.active { display:flex; }
  .nav-foot .eta { font-weight:700; color:var(--green); }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal.hidden { display:none; }
  .modal .card { background:#fff; border-radius:14px; padding:20px; width:100%; max-width:420px; }
  .modal h2 { margin:0 0 6px; font-size:18px; }
  .modal p { font-size:13px; color:#555; line-height:1.5; }
  .modal .row { display:flex; align-items:center; gap:10px; margin:12px 0; font-size:14px; }
  .modal .actions { display:flex; gap:10px; margin-top:8px; }
  .modal button { flex:1; padding:12px; font-size:15px; border:none; border-radius:10px; cursor:pointer; }
  .modal .save { background:var(--green); color:#fff; }
  .modal .cancel { background:#eee; }

  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:12px 18px; border-radius:24px; font-size:14px; z-index:3000; opacity:0; transition:opacity .3s; max-width:90%; text-align:center; }
  .toast.show { opacity:1; }
  .maplibregl-ctrl-attrib { font-size:10px; }
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <h1>🛵 Roller-Navi 45</h1>
    <button class="gear" id="btnSettings" title="Einstellungen">⚙️</button>
  </header>

  <div class="banner" id="banner">✓ Roller-Profil: meidet Autobahnen &amp; Kraftfahrtstraßen. Bitte trotzdem auf die Beschilderung achten.</div>

  <div class="search-bar" id="searchbar">
    <input id="dest" type="text" placeholder="Ziel eingeben (z. B. Marktplatz, Köln)" autocomplete="off">
    <div class="suggestions hidden" id="suggestions"></div>
  </div>

  <div id="mapwrap">
    <div id="map"></div>

    <div class="nav-hud" id="navHud">
      <div class="arrow" id="navArrow">⬆️</div>
      <div class="txt">
        <div class="nav-dist" id="navDist">–</div>
        <div class="nav-instr" id="navInstr">Navigation startet…</div>
      </div>
      <button class="quit" id="btnQuitNav">Beenden</button>
    </div>

    <div class="nav-foot" id="navFoot">
      <span id="navRemaining">–</span>
      <span class="eta" id="navEta">–</span>
    </div>

    <div class="fab">
      <button id="btnRecenter" title="Zentrieren" style="display:none">🧭</button>
      <button id="btnLocate" title="Mein Standort">📍</button>
      <button class="go" id="btnRoute" title="Route berechnen">▶</button>
    </div>
  </div>

  <div class="route-info hidden" id="routeInfo">
    <div class="route-summary">
      <div>
        <div class="big" id="rDist">–</div>
        <div class="sub" id="rTime">–</div>
        <div class="safe" id="rSafe"></div>
      </div>
      <button class="close" id="btnCloseRoute">✕</button>
    </div>
    <button class="start-nav" id="btnStartNav">🧭 3D-Navigation starten</button>
    <div class="steps" id="steps"></div>
  </div>
</div>

<div class="modal hidden" id="settings">
  <div class="card">
    <h2>Einstellungen</h2>
    <p>Diese App nutzt das <b>Roller-/Moped-Profil</b> (Valhalla, FOSSGIS) und meidet Autobahnen und Kraftfahrtstraßen. Keine Anmeldung nötig.</p>
    <label class="row"><input type="checkbox" id="voiceToggle"> Sprachansagen aktivieren</label>
    <div class="actions">
      <button class="cancel" id="btnCancelKey">Abbrechen</button>
      <button class="save" id="btnSaveKey">Speichern</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";

const VALHALLA = "https://valhalla1.openstreetmap.de/route";
const NOMINATIM = "https://nominatim.openstreetmap.org/search";
const STYLE = "https://tiles.openfreemap.org/styles/liberty";

let map, destMarker, puck, styleReady = false;
let startLatLng = null, destLatLng = null, suggestTimer = null, follow = true;

let nav = {
  active:false, watchId:null, coords:[], steps:[], target:0, announcedPre:-1,
  totalDist:0, offRouteCount:0, wakeLock:null, rerouting:false, lastPos:null, hasHighway:false
};

// ---------- Helpers ----------
function voiceOn(){ return localStorage.getItem("voice") !== "off"; }
function toast(msg, ms=2600){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),ms); }
function fmtDist(m){ return m>=1000 ? (m/1000).toFixed(1).replace(".",",")+" km" : Math.round(m)+" m"; }
function fmtDur(s){ const min=Math.round(s/60); if(min<60) return min+" Min"; const h=Math.floor(min/60),r=min%60; return h+" Std "+r+" Min"; }
function haversine(a,b){ const R=6371000,toR=x=>x*Math.PI/180; const dLat=toR(b[0]-a[0]),dLon=toR(b[1]-a[1]),la1=toR(a[0]),la2=toR(b[0]); const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function bearing(a,b){ const toR=x=>x*Math.PI/180,toD=x=>x*180/Math.PI; const y=Math.sin(toR(b[1]-a[1]))*Math.cos(toR(b[0])); const x=Math.cos(toR(a[0]))*Math.sin(toR(b[0]))-Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1])); return (toD(Math.atan2(y,x))+360)%360; }
function speak(text){ if(!voiceOn()||!("speechSynthesis" in window)||!text) return; try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; u.rate=1.0; window.speechSynthesis.speak(u);}catch(e){} }

// Valhalla maneuver type -> arrow
function arrowFor(t){
  const left=[3,15,19,21,24], right=[2,10,18,20,23];
  if([4,5,6].includes(t)) return "🏁";
  if([12,13].includes(t)) return "⮌";
  if([26,27].includes(t)) return "🔄";
  if(t===16) return "↖️"; if(t===9) return "↗️";
  if(t===14||left.includes(t)) return "⬅️";
  if(t===11||right.includes(t)) return "➡️";
  return "⬆️";
}

// Valhalla polyline (precision 6) decoder -> [[lat,lon],...]
function decodePolyline(str, precision){
  let index=0,lat=0,lng=0,coords=[],factor=Math.pow(10,precision||6),shift,result,b;
  while(index<str.length){
    shift=0;result=0; do{ b=str.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lat += (result&1)? ~(result>>1):(result>>1);
    shift=0;result=0; do{ b=str.charCodeAt(index++)-63; result|=(b&0x1f)<<shift; shift+=5; }while(b>=0x20);
    lng += (result&1)? ~(result>>1):(result>>1);
    coords.push([lat/factor,lng/factor]);
  }
  return coords;
}

// ---------- Map ----------
function initMap(){
  map = new maplibregl.Map({ container:"map", style:STYLE, center:[10.0,51.0], zoom:5, pitch:0, bearing:0, maxPitch:75, attributionControl:{compact:true} });
  map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "top-left");
  map.on("load", () => {
    styleReady=true;
    map.addSource("route",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    let firstSymbol; for(const l of map.getStyle().layers){ if(l.type==="symbol"){ firstSymbol=l.id; break; } }
    map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#0d3d11","line-width":12,"line-opacity":.9}},firstSymbol);
    map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#39b54a","line-width":7}},firstSymbol);
  });
  map.on("click", e=>{ if(!nav.active) setDest([e.lngLat.lat,e.lngLat.lng],"Gewählter Punkt"); });
  map.on("dragstart", ()=>{ if(nav.active){ follow=false; document.getElementById("btnRecenter").style.display="block"; } });
}
function setDest(latlng,label){
  destLatLng=latlng;
  if(destMarker) destMarker.setLngLat([latlng[1],latlng[0]]);
  else destMarker=new maplibregl.Marker({color:"#1b5e20"}).setLngLat([latlng[1],latlng[0]]).addTo(map);
  if(!nav.active) map.flyTo({center:[latlng[1],latlng[0]],zoom:Math.max(map.getZoom(),14)});
}
function setRouteData(coords){
  if(!map.getSource("route")) return;
  map.getSource("route").setData({type:"Feature",geometry:{type:"LineString",coordinates:coords.map(c=>[c[1],c[0]])}});
}

// ---------- Geolocation ----------
function locate(center=true){
  if(!navigator.geolocation){ toast("Standort wird nicht unterstützt."); return; }
  toast("Suche Standort…");
  navigator.geolocation.getCurrentPosition(
    pos=>{ const ll=[pos.coords.latitude,pos.coords.longitude]; startLatLng=ll; if(center) map.flyTo({center:[ll[1],ll[0]],zoom:15}); toast("Standort gefunden."); },
    err=>toast("Standort nicht verfügbar: "+err.message),
    {enableHighAccuracy:true,timeout:10000,maximumAge:0});
}

// ---------- Geocoding ----------
async function geocode(query){
  const url=`${NOMINATIM}?format=json&limit=5&addressdetails=1&countrycodes=de,at,ch&q=${encodeURIComponent(query)}`;
  const res=await fetch(url,{headers:{"Accept-Language":"de"}});
  if(!res.ok) throw new Error("Suche fehlgeschlagen");
  return res.json();
}
function showSuggestions(list){
  const box=document.getElementById("suggestions");
  if(!list.length){ box.classList.add("hidden"); box.innerHTML=""; return; }
  box.innerHTML="";
  list.forEach(item=>{ const div=document.createElement("div"); div.textContent=item.display_name;
    div.onclick=()=>{ document.getElementById("dest").value=item.display_name.split(",")[0]; box.classList.add("hidden"); setDest([parseFloat(item.lat),parseFloat(item.lon)],item.display_name.split(",")[0]); };
    box.appendChild(div); });
  box.classList.remove("hidden");
}

// ---------- Routing (Valhalla motor_scooter) ----------
async function fetchRoute(from,to){
  const body={ locations:[{lat:from[0],lon:from[1]},{lat:to[0],lon:to[1]}], costing:"motor_scooter",
    costing_options:{ motor_scooter:{ top_speed:45 } }, directions_options:{ units:"kilometers", language:"de-DE" } };
  const res=await fetch(VALHALLA,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new Error("Router "+res.status);
  const data=await res.json();
  if(!data.trip||!data.trip.legs||!data.trip.legs.length) throw new Error("Keine Route gefunden");
  return data;
}
function parseRoute(data){
  const trip=data.trip, leg=trip.legs[0];
  const coords=decodePolyline(leg.shape,6);
  const steps=leg.maneuvers.map(m=>{
    const pt=coords[m.begin_shape_index]||coords[0];
    return { instruction:m.instruction, verbal:(m.verbal_pre_transition_instruction||m.instruction), type:m.type, lat:pt[0], lon:pt[1], distance:(m.length||0)*1000 };
  });
  return { coords, steps, distance:trip.summary.length*1000, duration:trip.summary.time, hasHighway:!!trip.summary.has_highway };
}
async function route(){
  if(!startLatLng){ toast("Kein Startpunkt – tippe auf 📍."); locate(false); return; }
  if(!destLatLng){ toast("Kein Ziel ausgewählt."); return; }
  toast("Berechne rollertaugliche Route…");
  try { drawRoute(await fetchRoute(startLatLng,destLatLng)); }
  catch(e){ toast("Routing-Fehler: "+e.message,4000); }
}
function drawRoute(data){
  const r=parseRoute(data);
  setRouteData(r.coords);
  nav.coords=r.coords; nav.steps=r.steps; nav.totalDist=r.distance; nav.hasHighway=r.hasHighway;
  if(!nav.active){
    const lons=r.coords.map(c=>c[1]),lats=r.coords.map(c=>c[0]);
    map.fitBounds([[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]],{padding:60,pitch:0});
  }
  document.getElementById("rDist").textContent=fmtDist(r.distance);
  document.getElementById("rTime").textContent="ca. "+fmtDur(r.duration);
  const safe=document.getElementById("rSafe");
  if(r.hasHighway){ safe.className="warn"; safe.textContent="⚠ Achtung: Route könnte eine Schnellstraße enthalten – bitte Beschilderung prüfen."; }
  else { safe.className="safe"; safe.textContent="✓ Ohne Autobahn / Kraftfahrtstraße"; }
  const box=document.getElementById("steps"); box.innerHTML="";
  r.steps.forEach(st=>{ const d=document.createElement("div"); d.className="step"; d.innerHTML=`<span class="dist">${fmtDist(st.distance)}</span><span>${st.instruction}</span>`; box.appendChild(d); });
  document.getElementById("routeInfo").classList.remove("hidden");
}

// ---------- 3D Live navigation ----------
function navChrome(on){
  document.getElementById("hdr").classList.toggle("nav-hide",on);
  document.getElementById("banner").classList.toggle("nav-hide",on);
  document.getElementById("searchbar").classList.toggle("nav-hide",on);
  document.getElementById("navHud").classList.toggle("active",on);
  document.getElementById("navFoot").classList.toggle("active",on);
  document.getElementById("btnRoute").style.display=on?"none":"block";
  document.getElementById("btnLocate").style.display=on?"none":"block";
  if(!on) document.getElementById("btnRecenter").style.display="none";
  if(on) document.getElementById("routeInfo").classList.add("hidden"); else document.getElementById("routeInfo").classList.remove("hidden");
  setTimeout(()=>map.resize(),50);
}
async function startNav(){
  if(!nav.coords.length){ toast("Erst eine Route berechnen."); return; }
  if(!navigator.geolocation){ toast("Standort wird nicht unterstützt."); return; }
  nav.active=true; nav.target=nav.steps.length>1?1:0; nav.announcedPre=-1; nav.offRouteCount=0; nav.lastPos=null; follow=true;
  navChrome(true);
  if(!puck){ const el=document.createElement("div"); el.className="puck"; puck=new maplibregl.Marker({element:el,rotationAlignment:"map",pitchAlignment:"map"}).setLngLat([0,0]).addTo(map); }
  requestWakeLock(); speak("Navigation gestartet.");
  nav.watchId=navigator.geolocation.watchPosition(onNavPosition, err=>toast("GPS-Fehler: "+err.message,3500), {enableHighAccuracy:true,timeout:15000,maximumAge:1000});
}
function stopNav(){
  nav.active=false;
  if(nav.watchId!=null){ navigator.geolocation.clearWatch(nav.watchId); nav.watchId=null; }
  navChrome(false); map.easeTo({pitch:0,bearing:0,duration:600}); releaseWakeLock();
  if("speechSynthesis" in window) window.speechSynthesis.cancel();
}
function nearestRouteDist(pos){ let min=Infinity; for(const c of nav.coords){ const d=haversine(pos,c); if(d<min) min=d; } return min; }
function remainingDistance(){ let rem=0; for(let i=nav.target;i<nav.steps.length;i++) rem+=nav.steps[i].distance||0; return rem; }

async function onNavPosition(p){
  if(!nav.active) return;
  const pos=[p.coords.latitude,p.coords.longitude];
  let hdg=(p.coords.heading!=null&&!isNaN(p.coords.heading)&&p.coords.speed>0.5)?p.coords.heading:(nav.lastPos?bearing(nav.lastPos,pos):(map.getBearing()||0));
  nav.lastPos=pos;
  if(puck){ puck.setLngLat([pos[1],pos[0]]); puck.setRotation(hdg); }
  if(follow) map.easeTo({center:[pos[1],pos[0]],bearing:hdg,pitch:65,zoom:18,duration:900,essential:true});

  const offBy=nearestRouteDist(pos);
  if(offBy>60){
    nav.offRouteCount++;
    if(nav.offRouteCount>=2 && !nav.rerouting){
      nav.rerouting=true; document.getElementById("navInstr").textContent="Route wird neu berechnet…"; speak("Route wird neu berechnet.");
      try{ const r=parseRoute(await fetchRoute(pos,destLatLng)); setRouteData(r.coords); nav.coords=r.coords; nav.steps=r.steps; nav.totalDist=r.distance; nav.target=r.steps.length>1?1:0; nav.announcedPre=-1; }catch(e){}
      nav.offRouteCount=0; nav.rerouting=false;
    }
  } else nav.offRouteCount=0;

  if(nav.target>=nav.steps.length){ arrive(); return; }
  const step=nav.steps[nav.target];
  const dToTurn=haversine(pos,[step.lat,step.lon]);
  document.getElementById("navArrow").textContent=arrowFor(step.type);
  document.getElementById("navDist").textContent=fmtDist(dToTurn);
  document.getElementById("navInstr").textContent=step.instruction;
  const rem=remainingDistance();
  document.getElementById("navRemaining").textContent="Rest: "+fmtDist(rem);
  const etaMin=Math.round((rem/1000)/35*60);
  document.getElementById("navEta").textContent="≈ "+(etaMin<1?"<1":etaMin)+" Min";
  if(dToTurn<130 && nav.announcedPre!==nav.target){ nav.announcedPre=nav.target; speak("In "+Math.round(dToTurn/10)*10+" Metern: "+step.verbal); }
  if(dToTurn<25){ nav.target++; nav.announcedPre=-1; if(nav.target<nav.steps.length) speak(nav.steps[nav.target].verbal); }
}
function arrive(){
  document.getElementById("navArrow").textContent="🏁";
  document.getElementById("navDist").textContent="Ziel";
  document.getElementById("navInstr").textContent="Du hast dein Ziel erreicht.";
  speak("Du hast dein Ziel erreicht."); setTimeout(stopNav,4000);
}
async function requestWakeLock(){ try{ if("wakeLock" in navigator) nav.wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWakeLock(){ try{ if(nav.wakeLock){ nav.wakeLock.release(); nav.wakeLock=null; } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(nav.active&&document.visibilityState==="visible") requestWakeLock(); });

// ---------- Settings ----------
function openSettings(){ document.getElementById("voiceToggle").checked=voiceOn(); document.getElementById("settings").classList.remove("hidden"); }
function closeSettings(){ document.getElementById("settings").classList.add("hidden"); }

// ---------- Events ----------
document.addEventListener("DOMContentLoaded",()=>{
  initMap();
  document.getElementById("btnSettings").onclick=openSettings;
  document.getElementById("btnCancelKey").onclick=closeSettings;
  document.getElementById("btnSaveKey").onclick=()=>{ localStorage.setItem("voice",document.getElementById("voiceToggle").checked?"on":"off"); closeSettings(); toast("Einstellungen gespeichert."); };
  document.getElementById("btnLocate").onclick=()=>locate(true);
  document.getElementById("btnRoute").onclick=route;
  document.getElementById("btnCloseRoute").onclick=()=>document.getElementById("routeInfo").classList.add("hidden");
  document.getElementById("btnStartNav").onclick=startNav;
  document.getElementById("btnQuitNav").onclick=stopNav;
  document.getElementById("btnRecenter").onclick=()=>{ follow=true; document.getElementById("btnRecenter").style.display="none"; if(nav.lastPos) map.easeTo({center:[nav.lastPos[1],nav.lastPos[0]],pitch:65,zoom:18,duration:600}); };

  const destInput=document.getElementById("dest");
  destInput.addEventListener("input",()=>{ const q=destInput.value.trim(); clearTimeout(suggestTimer); if(q.length<3){ document.getElementById("suggestions").classList.add("hidden"); return; } suggestTimer=setTimeout(async()=>{ try{ showSuggestions(await geocode(q)); }catch(e){} },450); });
  destInput.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); clearTimeout(suggestTimer); geocode(destInput.value.trim()).then(list=>{ if(list[0]){ showSuggestions([]); setDest([parseFloat(list[0].lat),parseFloat(list[0].lon)],list[0].display_name.split(",")[0]); } }); } });

  locate(true);
});
</script>
</body>
</html>
